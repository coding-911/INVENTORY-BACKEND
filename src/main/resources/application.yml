spring:
  application:
    name: asset-backend
  # DB 접속 정보는 여기에 쓰지 않는다. SPRING_DATASOURCE_URL·USERNAME·PASSWORD 환경 변수로 넣는다 (NFR-01)
  jpa:
    open-in-view: false # docs/dev/conventions.md 5절
    hibernate:
      ddl-auto: validate # 테이블은 Flyway만 만든다 (docs/dev/tech-stack.md 2절)
  web:
    locale: ko # 메시지는 한국어로 고정. 검사 메시지가 브라우저 언어를 따르지 않게 한다 (docs/api/api-spec.md 1.4)
    locale-resolver: fixed
  data:
    web:
      pageable: # 목록 조회 규칙 (docs/api/api-spec.md 1.7)
        one-indexed-parameters: true
        default-page-size: 50
        max-page-size: 200

logging:
  pattern:
    correlation: "[%X{traceId:-}] " # 오류 응답의 traceId로 로그를 찾는다 (docs/api/api-spec.md 1.4)

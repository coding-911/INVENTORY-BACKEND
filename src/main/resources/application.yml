spring:
  application:
    name: asset-backend
  # DB 접속 정보는 여기에 쓰지 않는다. SPRING_DATASOURCE_URL·USERNAME·PASSWORD 환경 변수로 넣는다 (NFR-01)
  jpa:
    open-in-view: false # docs/dev/conventions.md 5절
    hibernate:
      ddl-auto: validate # 테이블은 Flyway만 만든다 (docs/dev/tech-stack.md 2절)
  web:
    locale: ko # 메시지는 한국어로 고정. 검사 메시지가 브라우저 언어를 따르지 않게 한다 (docs/api/api-spec.md 1.4)
    locale-resolver: fixed
  session: # 세션 로그인 (docs/api/api-spec.md 1.3)
    timeout: 8h # 마지막 요청 뒤 8시간이 지나면 다시 로그인
    jdbc:
      table-name: auth.spring_session
      initialize-schema: never # 테이블은 Flyway가 만든다 (V3)
  autoconfigure:
    # 스프링 시큐리티의 기본 사용자(임시 비밀번호를 로그에 찍는 것)를 만들지 않는다. 사용자는 auth.users에서 읽는다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  data:
    web:
      pageable: # 목록 조회 규칙 (docs/api/api-spec.md 1.7)
        one-indexed-parameters: true
        default-page-size: 50
        max-page-size: 200

asset:
  first-admin:
    # 사용 중인 관리자가 없을 때 앱이 켜지면서 만드는 관리자. 처음 로그인하면 비밀번호를 바꿔야 한다
    # 기본값이 없다. 관리자가 없는데 값이 없거나 비밀번호가 1234면 앱이 켜지지 않는다(개발 PC 기본값은 application-local.yml, ADR-17)
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}

logging:
  pattern:
    correlation: "[%X{traceId:-}] " # 오류 응답의 traceId로 로그를 찾는다 (docs/api/api-spec.md 1.4)
